services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the runtime environment}
      APP_URL: ${APP_URL:-http://localhost:3030}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ensibuuko}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in the runtime environment}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the runtime environment}
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000); if(!$$s){exit(1);} fclose($$s);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "3030:8080"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ensibuuko}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in the runtime environment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the runtime environment}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the runtime environment}
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
